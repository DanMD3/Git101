name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # ponytail: last-commit-only check; good enough for a workshop, use --from=origin/main for full PR ranges
      - run: npx commitlint --from=HEAD~1 --to=HEAD
